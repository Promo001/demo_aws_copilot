# Buildspec runs in the build stage of your pipeline.
version: 0.2
phases:
  install:
    commands:
      - echo "cd into $CODEBUILD_SRC_DIR"
      - cd $CODEBUILD_SRC_DIR
      # Download the copilot linux binary.
      - wget -q https://ecs-cli-v2-release.s3.amazonaws.com/copilot-linux-v1.34.0 -O copilot-linux
      - chmod +x ./copilot-linux
  build:
    commands:
      - echo "Run your tests"
      # - make test
  post_build:
    commands:
      - ls -l
      - export COLOR="false"
      - export CI="true"
      - echo "SOURCE_BRANCH_NAME=$SOURCE_BRANCH_NAME CODEBUILD_SOURCE_VERSION=$CODEBUILD_SOURCE_VERSION"
      - pipeline=$(cat $CODEBUILD_SRC_DIR/copilot/pipelines/demo-pipeline/manifest.yml | ruby -ryaml -rjson -e 'puts JSON.pretty_generate(YAML.load(ARGF))')
      - pl_envs=$(echo $pipeline | jq -r '.stages[].name')
      # Find all the local services in the workspace.
      - svc_ls_result=$(./copilot-linux svc ls --local --json)
      - svc_list=$(echo $svc_ls_result | jq '.services')
      - >
        if [ ! "$svc_list" = null ]; then
          svcs=$(echo $svc_ls_result | jq -r '.services[].name');
        fi
      # Find all the local jobs in the workspace.
      - job_ls_result=$(./copilot-linux job ls --local --json)
      - job_list=$(echo $job_ls_result | jq '.jobs')
      - >
        if [ ! "$job_list" = null ]; then
          jobs=$(echo $job_ls_result | jq -r '.jobs[].name');
        fi
      # Raise error if no services or jobs are found.
      - >
        if [ "$svc_list" = null ] && [ "$job_list" = null ]; then
          echo "No services or jobs found for the pipeline to deploy. Please create at least one service or job and push the manifest to the remote." 1>&2;
          exit 1;
        fi
      # Determine tag: prefer SOURCE_BRANCH_NAME if it carries refs/tags/*; else fallback to CODEBUILD_SOURCE_VERSION; else fallback to build ID
      - >
        git_tag="";
        if echo "$SOURCE_BRANCH_NAME" | grep -q '^refs/tags/'; then
          git_tag=$(echo "$SOURCE_BRANCH_NAME" | sed -E 's#^refs/tags/##');
          echo "Detected tag from SOURCE_BRANCH_NAME: $git_tag";
        elif echo "$CODEBUILD_SOURCE_VERSION" | grep -q '^refs/tags/'; then
          git_tag=$(echo "$CODEBUILD_SOURCE_VERSION" | sed -E 's#^refs/tags/##');
          echo "Detected tag from CODEBUILD_SOURCE_VERSION (refs): $git_tag";
        elif echo "$CODEBUILD_SOURCE_VERSION" | grep -Eq '^[vV]?[0-9]'; then
          git_tag="$CODEBUILD_SOURCE_VERSION";
          echo "Detected tag from CODEBUILD_SOURCE_VERSION (raw): $git_tag";
        else
          echo "No tag detected via SOURCE_BRANCH_NAME or CODEBUILD_SOURCE_VERSION; will use fallback";
        fi
      # The tag is the build ID but we replaced the colon ':' with a dash '-' if no git tag.
      # We truncate the tag (from the front) to 128 characters, the limit for Docker tags
      # (https://docs.docker.com/engine/reference/commandline/tag/)
      # Check if the `svc package` commanded exited with a non-zero status. If so, echo error msg and exit.
      - >
        for env in $pl_envs; do
          if [ -n "$git_tag" ]; then
            tag=$git_tag
            echo "Using git tag: $tag for env=$env";
          else
            tag=$(echo ${CODEBUILD_BUILD_ID##*:}-$env | sed 's/:/-/g' | rev | cut -c 1-128 | rev)
            echo "Using fallback build tag: $tag for env=$env";
          fi
          for svc in $svcs; do
          echo "Packaging service '$svc' for env '$env' with tag '$tag'";
          ./copilot-linux svc package -n $svc -e $env --output-dir './infrastructure' --tag $tag --upload-assets;
          if [ $? -ne 0 ]; then
            echo "Cloudformation stack and config files were not generated. Please check build logs to see if there was a manifest validation error." 1>&2;
            exit 1;
          fi
          done;
          for job in $jobs; do
          echo "Packaging job '$job' for env '$env' with tag '$tag'";
          ./copilot-linux job package -n $job -e $env --output-dir './infrastructure' --tag $tag --upload-assets;
          if [ $? -ne 0 ]; then
            echo "Cloudformation stack and config files were not generated. Please check build logs to see if there was a manifest validation error." 1>&2;
            exit 1;
          fi
          done;
        done;
      - ls -lah ./infrastructure
artifacts:
  files:
    - "infrastructure/*"
